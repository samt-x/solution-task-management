name: Sync All tasks

# Fyller samlebrettet «SAMT-BU Overview – All tasks» (Project 12) fra alle offentlige repoer,
# og holder issuet «Bidragsytere utenfor orgen (N)» oppdatert (#49).
# Kjører bare etter tidsplan og manuelt – aldri på pull requests, så secrets ikke
# kan nås fra forks. Token lages per kjøring fra appen SAMT-BU Task sync.

on:
  schedule:
    - cron: '17 * * * *'   # hver time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Bare vis hva som ville blitt endret'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # workflow-alert.py melder feil som issue

concurrency:
  group: sync-all-tasks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lag token fra appen
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23li5HEtj5juPOKb0x   # SAMT-BU Task sync (ikke hemmelig)
          private-key: ${{ secrets.TASK_SYNC_PRIVATE_KEY }}
          owner: samt-x

      - name: Synk
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/scripts/sync-all-tasks.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Kontoer utenfor orgen med bidrag → issuet «Bidragsytere utenfor orgen (N)» (#49).
      # Appens token leser (ser private medlemskap), GITHUB_TOKEN skriver issuet.
      - name: Bidragsytere utenfor orgen
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_WRITE_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/outside-contributors.py ${{ !inputs.dry_run && '--update' || '' }}

      # Feil meldes som issue, som lukkes ved neste vellykkede kjøring (se workflow-alert.py)
      - name: Meld feil som issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/workflow-alert.py fail "Sync All tasks" "samlebrettet (Project 12) eller lista over bidragsytere utenfor orgen"

      - name: Lukk feilmelding
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/workflow-alert.py ok "Sync All tasks"
